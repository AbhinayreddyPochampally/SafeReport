<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>SafeReport App Icon</title>
  <defs>
    <linearGradient id="bg" x1="160" y1="80" x2="880" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F46"/>
      <stop offset="1" stop-color="#03142F"/>
