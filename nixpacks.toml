# Nixpacks config for SafeReport (Next.js 14 App Router on Railway).
# Pins Node 20 and explicit build/start phases so the builder doesn't
# fall back to a generic Node detector that misses `next build`.

[phases.setup]
# npm ships with nodejs_20 — listing it separately fails because there
# is no standalone `npm` derivation in nixpkgs.
nixPkgs = ["nodejs_20"]

# Nixpacks defaults NODE_ENV=production, which makes `npm ci` skip
# devDependencies — but tailwindcss / postcss / autoprefixer / typescript
# all live in devDependencies and `next build` needs every one of them.
# Force dev installs so the build phase has the toolchain. The runtime
# image stays slim because `next start` only ships the compiled output.
[phases.install]
cmds = ["npm ci --include=dev --prefer-offline --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
